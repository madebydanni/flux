SilverStripe\Admin\LeftAndMain:
  flux_live_update: true
  extra_requirements_css:
    - 'dannidickson/flux: client/dist/styles/bundle.css'
  extensions:
    FluxLeftAndMainExtension: Flux\Extension\FluxLeftAndMainExtension

SilverStripe\Forms\GridField\GridFieldDetailForm_ItemRequest:
  extensions:
    FluxGridDetailFormExtension: Flux\Extension\FluxGridDetailFormExtension

# Covers every factory-built form, elemental's inline block form included, where
# updateCMSFields alone misses fields the record adds after parent::getCMSFields().
SilverStripe\Forms\DefaultFormFactory:
  extensions:
    FluxFormFactoryExtension: Flux\Extension\FluxFormFactoryExtension

SilverStripe\ORM\DataObject:
  extensions:
    FluxDataObjectExtension: Flux\Extension\FluxDataObjectExtension

---
Name: flux-base-element-extensions
Only:
  classexists: 'DNADesign\Elemental\Models\BaseElement'
---
DNADesign\Elemental\Models\BaseElement:
  extensions:
    FluxBaseElementExtension: Flux\Extension\FluxBaseElementExtension


